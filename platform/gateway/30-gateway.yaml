# El Gateway compartido del homelab (ADR 0006, punto 4): una sola entrada
# HTTP para todas las apps.
#
# Cada app engancha sus HTTPRoute desde su propio namespace, pero SOLO si
# ese namespace tiene el label "homelab/gateway: allowed". Mínimo
# privilegio: una app no se puede publicar sola; habilitarla es una
# decisión explícita, que queda en el repo.
#
# Solo HTTP por ahora; TLS llega en la Fase 9.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: homelab-platform
spec:
  gatewayClassName: envoy
  # Configuración de su Envoy (Service NodePort 30080): 20-envoyproxy.yaml.
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: homelab
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab/gateway: allowed
    # La entrada de la interfaz de Argo CD (ADR 0010, punto 4; runbook "CD
    # con Argo CD", 6.6.2). Otro puerto, con su propio NodePort (30081), para
    # que HAProxy la publique SOLO en 127.0.0.1 → tailscale serve: la red de
    # casa no llega (el listener "http" sí está en 192.168.1.16:80).
    # Acepta rutas solo del namespace argocd, por su nombre (la etiqueta
    # kubernetes.io/metadata.name la pone Kubernetes y no se puede falsificar
    # desde el manifiesto del namespace).
    - name: argocd
      protocol: HTTP
      port: 8081
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
