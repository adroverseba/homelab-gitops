# La Application del Habit Tracker: Argo CD compara apps/habit-tracker/ de
# la rama main con el clúster y lo aplica solo. Runbook "CD con Argo CD",
# pasos 6.4c (creada, con sync a mano) y 6.5 (sync automático).
#
# Desde el 6.5, la app NO se cambia con kubectl: se cambia en git. Un cambio
# a mano en un campo de git se deshace solo (selfHeal).
#
# Sin el finalizer "resources-finalizer.argocd.argoproj.io", a propósito:
# si se borra esta Application, la app sigue corriendo (Argo CD deja de
# mirarla, no la borra).
#
# Los Secrets de la app (ghcr-pull, habit-tracker-backend) no están en git:
# Argo CD no los conoce ni los toca.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: habit-tracker
  labels:
    app.kubernetes.io/part-of: homelab-platform
  annotations:
    # Comparar del lado del servidor (estable desde Argo CD 3.1): el
    # apiserver hace un ensayo (dry-run) del apply y Argo CD compara con eso,
    # así conoce los valores por defecto de cualquier CRD. Con
    # ServerSideApply, la comparación por defecto ("Structured-Merge Diff",
    # discontinuada) no los conoce, y el HTTPRoute quedaba OutOfSync para
    # siempre (group, kind y weight que completa el CRD de Gateway API).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: habit-tracker
  source:
    repoURL: git@github.com:adroverseba/homelab-gitops.git
    targetRevision: main
    path: apps/habit-tracker
  destination:
    server: https://kubernetes.default.svc
    namespace: habit-tracker
  syncPolicy:
    # Sincronización automática (ADR 0010, punto 3; runbook, paso 6.5):
    # - cada cambio de main en apps/habit-tracker/ se aplica solo;
    # - selfHeal: un cambio hecho a mano en un campo que define git se
    #   deshace solo. Ojo: lo que se AGREGA en un campo que git no menciona
    #   no cuenta como diferencia y queda (probado en el 6.5a);
    # - prune: false. Si algo desaparece de git, Argo CD NO lo borra del
    #   clúster: lo marca y se borra a mano. Se revisa con alertas y backup
    #   fuera de casa.
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      # Apply del lado del servidor, como en la plataforma. Resuelve el
      # "falso configured" de los PDB y del Gateway con el apply clásico.
      - ServerSideApply=true
