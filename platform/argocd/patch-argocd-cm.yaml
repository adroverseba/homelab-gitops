# Parche de argocd-cm (lo usa kustomization.yaml). Runbook "CD con Argo
# CD", paso 6.4a.
#
# resource.exclusions son los tipos que Argo CD no mira ni aplica. La lista
# es la oficial de la v3.5.5 COPIADA ENTERA (el valor es un solo texto: se
# reemplaza completo), con UN cambio: EndpointSlice deja de estar excluido.
# La app lo usa para apuntar el Service "postgres" a la VM db
# (apps/habit-tracker/10-postgres.yaml); excluido, Argo CD no lo aplicaría.
#
# Costo: Argo CD mira también los EndpointSlice automáticos de cada
# Service (pocos en este clúster). Al actualizar Argo CD, comparar esta
# lista con la del install.yaml nuevo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  resource.exclusions: |
    ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
    ### homelab: sin EndpointSlice (antes: apiGroups '' y discovery.k8s.io, kinds Endpoints y EndpointSlice)
    - apiGroups:
      - ''
      kinds:
      - Endpoints
    ### Internal Kubernetes resources excluded reduce the number of watched events
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    ### Intermediate Certificate Request excluded reduce the number of watched events
    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
