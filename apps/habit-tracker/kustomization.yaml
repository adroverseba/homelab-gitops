# La app Habit Tracker, armada con Kustomize (runbook "CD con Argo CD",
# paso CD.7.1). Argo CD la detecta sola: si la carpeta tiene un
# kustomization.yaml, la arma con Kustomize en vez de leer los YAML sueltos.
#
# Para qué: las imágenes. Su tag y su digest viven acá, en un solo lugar,
# y el CI del repo de la app los cambia con una herramienta
#   kustomize edit set image ghcr.io/adroverseba/habit-tracker-backend:sha-<commit>@sha256:<digest>
# en vez de editar los Deployments con sed. Ese cambio llega como un PR
# que revisa el usuario (ADR 0010, punto 2).
#
# Sin namespace ni etiquetas comunes acá: cada archivo ya los declara, y
# Kustomize tiene que armar exactamente los mismos objetos que antes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 10-postgres.yaml
  - 20-frontend.yaml
  - 30-backend.yaml
  - 40-httproute.yaml
images:
  # Las imágenes que corren en producción, por tag y digest. Las cambia el
  # PR que abre el CI del repo de la app (job gitops-pr, con yq: este
  # comentario se conserva); qué commit las construyó se ve en el tag
  # (sha-<commit>) y en el PR que las trajo.
  - name: ghcr.io/adroverseba/habit-tracker-backend
    newTag: sha-20cc4bd
    digest: sha256:5ba91aaaa3adf70c9ec81a45ee23b0230bc0a94809a596a07f16128186d5f2f3
  - name: ghcr.io/adroverseba/habit-tracker-frontend
    newTag: sha-20cc4bd
    digest: sha256:a396b672efafdcbd463a50a8ba435e8e72a8ca04cb9b4fe1e40b1f29e85c3832
