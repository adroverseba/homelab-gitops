# Backend del Habit Tracker (Spring Boot). Runbook de la Fase 6, pasos 6.2.4
# (ConfigMap) y 6.2.5 (ServiceAccount, Deployment y Service). La API se
# prueba con port-forward hasta que el Gateway rutee /api (6.3).
#
# Lo secreto NO va acá: DB_USER, DB_PASSWORD y APP_ACCESS_SECRET viven en el
# Secret habit-tracker-backend, creado a mano en el control-plane (ver el
# README, "Secretos por app").
---
# Variables que lee backend/src/main/resources/application.yml (perfil prod).
# Un cambio acá NO reinicia los Pods: las variables de entorno se leen al
# arrancar. Después de cambiarlo hace falta un rollout restart del backend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: habit-tracker-backend-config
  namespace: habit-tracker
  labels:
    app.kubernetes.io/name: habit-tracker-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: habit-tracker
data:
  # Sin esto, la app arranca en "dev" sin avisar (DEPLOY.md de la app).
  SPRING_PROFILES_ACTIVE: prod
  # El Service sin selector de 10-postgres.yaml: un nombre estable, no la IP.
  DB_HOST: postgres.habit-tracker.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: habit_tracker
  # Se pega tal cual al final de la URL JDBC. require = cifrado obligatorio
  # (el pg_hba de db solo acepta hostssl), pero sin verificar el certificado
  # del servidor: verify-full queda para la Fase 9.
  DB_SSL_MODE: "?sslmode=require"
  # La dirección de Tailscale (ADR 0009): tailscale serve descifra el HTTPS
  # en el host y el backend recibe http, así que el Origin https:// del
  # navegador le parece de otro origen y rechaza las escrituras con 403
  # (Invalid CORS request). Arreglo de fondo pendiente: que el backend sepa
  # que la petición original fue HTTPS (X-Forwarded-Proto). Runbook -
  # Tailscale y HTTPS, TS.10.
  APP_CORS_ALLOWED_ORIGINS: "https://homelab.taile02a6a.ts.net"
  # A propósito NO van:
  # - SENTRY_DSN: sin DSN, Sentry queda inerte. El homelab no le manda
  #   errores al Sentry de producción.
  # - SERVER_PORT: el ENTRYPOINT de la imagen pasa -Dserver.port=8080, y una
  #   propiedad de la JVM le gana a una variable de entorno.
---
# Identidad propia del Pod, sin token de la API de Kubernetes montado: el
# backend no le habla al clúster (mínimo privilegio). Desde acá se usa el
# Secret ghcr-pull para bajar la imagen privada.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: habit-tracker-backend
  namespace: habit-tracker
  labels:
    app.kubernetes.io/name: habit-tracker-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: habit-tracker
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-tracker-backend
  namespace: habit-tracker
  labels:
    app.kubernetes.io/name: habit-tracker-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: habit-tracker
spec:
  # Una réplica por worker (runbook de alta disponibilidad, HA.3). Cada
  # una abre hasta 10 conexiones a db (Hikari por defecto): 20 de las 100
  # que acepta Postgres.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: habit-tracker-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: habit-tracker-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: habit-tracker
    spec:
      serviceAccountName: habit-tracker-backend
      automountServiceAccountToken: false
      # Sin las variables POSTGRES_SERVICE_HOST, POSTGRES_PORT=tcp://… que
      # Kubernetes agrega por cada Service del namespace: la app no las usa,
      # y son una fuente clásica de choques de nombres.
      enableServiceLinks: false
      # Reparto por nodo (runbook de alta disponibilidad, HA.3): con 2
      # réplicas, una en cada worker. Mismos campos que el frontend; el
      # porqué de cada uno está comentado en 20-frontend.yaml.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: habit-tracker-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001          # el mismo usuario que fija el PR #2 del Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Imagen del CI desde main (lint + tests + Trivy), fijada por
          # digest. Merge 41141e9 (PR #2): bases fijadas por digest, usuario
          # 10001 y exec en el ENTRYPOINT.
          image: ghcr.io/adroverseba/habit-tracker-backend:sha-41141e9@sha256:a150f61dfbb8feb56d20baf12fe2fc849e1b37647e94e06f83b70e90664e68ba
          # Sin command: el ENTRYPOINT de la imagen ("sh -c 'exec java …'")
          # deja a la JVM como PID 1, así recibe el SIGTERM y se apaga en
          # orden. El puerto queda en 8080 porque el Pod no define PORT
          # (enableServiceLinks: false evita variables inyectadas).
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: habit-tracker-backend-config
            - secretRef:
                name: habit-tracker-backend
          env:
            # Heap al 60 % del límite de memoria (el resto: metaspace, hilos,
            # code cache). Si se queda sin heap, la JVM termina y Kubernetes
            # la reinicia, en vez de seguir a medias.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Tomcat y la JVM escriben en /tmp: con el disco en solo lectura, /tmp
          # va en un emptyDir en disco (en memoria gastaría el límite de RAM).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Sin límite de CPU a propósito (el throttling frena a la JVM,
          # sobre todo al arrancar). El de memoria sí va.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi
          # /api/v1/health responde 200 si el proceso vive, sin consultar la
          # base: una caída de db no provoca reinicios en cadena.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 30    # hasta 150 s para arrancar (Flyway incluido)
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2       # margen para las pausas del GC
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          # Al apagarse, sigue atendiendo 10 s antes del SIGTERM: el mismo
          # arreglo que el frontend para la "carrera del desalojo" (el Envoy
          # se entera tarde de que el Pod salió de la lista). Después del
          # SIGTERM, la JVM tiene 20 s más (30 s de gracia por defecto). El
          # apagado ordenado de Tomcat (server.shutdown=graceful) es aparte,
          # en el repo de la app.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: habit-tracker-backend
  namespace: habit-tracker
  labels:
    app.kubernetes.io/name: habit-tracker-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: habit-tracker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: habit-tracker-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Un drain saca de a un Pod del backend y espera a que el reemplazo esté
# listo. Solo protege de las interrupciones voluntarias; el porqué de cada
# campo está en el PDB de 20-frontend.yaml.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: habit-tracker-backend
  namespace: habit-tracker
  labels:
    app.kubernetes.io/name: habit-tracker-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: habit-tracker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: habit-tracker-backend
  unhealthyPodEvictionPolicy: AlwaysAllow
