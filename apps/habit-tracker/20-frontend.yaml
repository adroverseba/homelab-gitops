# Frontend del Habit Tracker: nginx sin root que sirve el build de Vite.
# Runbook de la Fase 6, paso 6.2.3. La API (/api/) NO pasa por acá: la rutea
# el Gateway (6.3). El nginx de la imagen responde 404 a /api/ a propósito.
---
# Identidad propia del Pod, sin token de la API de Kubernetes montado: el
# frontend no le habla al clúster (mínimo privilegio). Desde acá se usa el
# Secret ghcr-pull para bajar la imagen privada.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: habit-tracker-frontend
  namespace: habit-tracker
  labels:
    app.kubernetes.io/name: habit-tracker-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: habit-tracker
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-tracker-frontend
  namespace: habit-tracker
  labels:
    app.kubernetes.io/name: habit-tracker-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: habit-tracker
spec:
  # Una réplica por worker: si se cae uno, la otra sigue atendiendo
  # (runbook de alta disponibilidad, HA.2; con 1 réplica, la caída de
  # worker-1 cortó la app 6 min 30 s en HA.1).
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: habit-tracker-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: habit-tracker-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: habit-tracker
    spec:
      serviceAccountName: habit-tracker-frontend
      automountServiceAccountToken: false
      # El scheduler reparte las réplicas por nodo. Solo se aplica al crear
      # cada Pod: no mueve los que ya corren.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Solo cuentan los nodos cuyos taints el Pod tolera. Sin esto
          # (el valor por defecto es Ignore), el control-plane cuenta como
          # un nodo con 0 Pods: una tercera réplica no entraría nunca, y el
          # reemplazo de un Pod de un worker caído quedaría Pending.
          nodeTaintsPolicy: Honor
          # El reparto se calcula por versión de la plantilla: en un
          # rollout, los Pods viejos no desvían a los nuevos.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: habit-tracker-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # usuario nginx de nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Imagen del CI (lint + tests + Trivy), fijada por digest.
          image: ghcr.io/adroverseba/habit-tracker-frontend:sha-3a4511e@sha256:4027842f7c629675c5695a5fef974efbbf043b97e8cea893eac428371a99661f
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # nginx-unprivileged escribe su pid y sus temporales en /tmp:
          # con el disco del contenedor en solo lectura, /tmp va en memoria.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          # Al apagarse, sigue atendiendo 10 s antes del SIGTERM. Kubernetes
          # saca el Pod de la lista de destinos y le avisa que se apague a la
          # vez, y el Envoy se entera un instante después: sin esta espera,
          # algún pedido le llega a un Pod que ya se va (la "carrera del
          # desalojo", confirmada con los logs del Envoy en la actualización
          # a la 1.35). La acción sleep no necesita un shell en la imagen, y
          # entra holgada en los 30 s de gracia por defecto.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: habit-tracker-frontend
  namespace: habit-tracker
  labels:
    app.kubernetes.io/name: habit-tracker-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: habit-tracker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: habit-tracker-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Un drain (mantenimiento, por ejemplo al actualizar Kubernetes) saca de a
# un Pod del frontend y espera a que el reemplazo esté listo. Protege solo
# de las interrupciones voluntarias (la API de eviction): una VM que se
# apaga no pide permiso.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: habit-tracker-frontend
  namespace: habit-tracker
  labels:
    app.kubernetes.io/name: habit-tracker-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: habit-tracker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: habit-tracker-frontend
  # Un Pod que no está listo (por ejemplo, en CrashLoopBackOff) se puede
  # desalojar igual: si no, un Pod roto trabaría el drain del nodo.
  unhealthyPodEvictionPolicy: AlwaysAllow
